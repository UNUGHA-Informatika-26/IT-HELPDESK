name: it_helpdesk_flutter
description: Starter Flutter app for IT Helpdesk with Firebase Authentication and Cloud Firestore.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.10
  provider: ^6.1.5+1
  go_router: ^18.1.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
